kayip_kervan:
  title: Kayıp Kervan
  hook: Boranda kaybolan tuz kervanının izi.
  brief: Kervan üç gündür kayıp; boran geçidi kapatmadan bulunup köye ulaştırılmalı.

golun_sirri:
  title: Gölün Sırrı
  hook: Suyun altında kalmış eski bir köy.
  brief: Çekilen göl batık bir köyü ortaya çıkardı; terk edilme sebebi sular altında.
