ilker_solo:
  quest: lost_caravan
  creator: ilker
  tone: balanced
  length: short
  story_bible:
    title: The Lost Caravan
    premise: Whitebend is going into winter without salt, and the caravan is missing at Blizzard Pass.
    personal_stake: Sherrick, the caravan master, once hauled rations to the company under siege.
    antagonist:
      name: Nail Aral
      want: Stop the caravan before the bridge gives way.
      method: Uses the lodges and the side paths.
      first_sign: A mule with a cut strap.
    ally:
      name: Elif
      want: To find her brother.
      secret: Nail is her father.
    twist: Not an ambush, a warning.
    beats:
      - A mule with a cut strap comes back to the square.
      - The tracks break off on stone by the creek.
      - A wounded driver at Blackhearth Lodge.
      - Elif confesses at Cistern Lodge.
      - The crack in the bridge footing comes into view.
      - Face to face with Nail at the bridgehead.
      - The caravan crosses lightened, or the bridge goes.
    finale_question: Will the salt reach the village?
    victory: Enough salt comes down to the village.
    defeat: The bridge goes.

