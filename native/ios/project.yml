name: Rokapi
options:
  bundleIdPrefix: app.rokapi
  deploymentTarget:
    iOS: "17.2"
packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    exactVersion: 1.3.1
  PurchaseKit:
    url: https://github.com/purchasekit/purchasekit-ios
    exactVersion: 0.9.0
targets:
  Rokapi:
    type: application
    platform: iOS
    sources:
      - Rokapi
    dependencies:
      - package: HotwireNative
      - package: PurchaseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rokapi
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ROKAPI_URL: http://localhost:3000
        Release:
          ROKAPI_URL: http://localhost:3000
    info:
      path: Rokapi/Info.plist
      properties:
        CFBundleDisplayName: Rokapi
        CFBundleLocalizations: [en, tr]
        RokapiURL: $(ROKAPI_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
schemes:
  Rokapi:
    build:
      targets:
        Rokapi: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    archive:
      config: Release
