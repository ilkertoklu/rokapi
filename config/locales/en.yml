        text: A moneylender who wants to be liked
      unknown_bard:
        text: A bard who wants one song people will remember
      gravedigger:
        text: A gravedigger who wants a better life for their child
      greedy_bridgekeeper:
        text: A bridge-keeper who wants a bigger cut
      last_of_the_house:
