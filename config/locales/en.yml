      set_fire:
        text: Someone has set two fires this week, and the next may cost a life
      beast_returns:
        text: A beast driven off years ago is back, and it comes closer every night
      kidnapped:
        text: Someone has been taken, and the time given for the ransom is running out
      stolen_stores:
        text: The winter stores were stolen in a single night
      broken_wedding:
        text: A wedding meant to end a feud was called off this morning
      empty_strongbox:
        text: The tax collector arrives in three days, and the strongbox is empty
      witch_bargain:
        text: The witch who saved this place in a hard winter comes at the full moon for what she was promised
      lost_messenger:
        text: The messenger sent for help never arrived, and no one knows whether help is coming
      false_accusation:
        text: Someone will be banished at dawn for a crime they swear they did not commit
      rival_claim:
        text: A rival has claimed the place and given everyone ten days to leave
      cut_off:
        text: The only way out has been cut off, and the food will last a week
