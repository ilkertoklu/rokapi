      unwilling_heir:
        text: An heir who wants nothing to do with the inheritance
      ambitious_clerk:
        text: A clerk who wants the master's seat
      path_child:
        text: A child who knows every path and wants a home
      old_captain:
        text: A retired captain who wants one last command
      doubted_healer:
        text: A healer no one believes
      weary_smuggler:
        text: A smuggler who wants out of the trade
      doubting_novice:
