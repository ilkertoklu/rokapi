      asker_is_cause:
        text: the one asking for help is the cause
      villain_protects:
        text: the one thought wicked is protecting someone
      left_willingly:
        text: what is gone went of its own will
      both_hide_same:
        text: both sides are hiding the same thing
      cover_for_worse:
        text: the trouble is a cover for something worse
      helper_profits:
        text: the one who helps most gains the most from it
      old_wrong:
        text: it all pays back a wrong done long ago
      no_villain:
        text: no one meant harm; a kindness went wrong
      trouble_shields:
        text: the trouble is keeping something worse away
      outsider_framed:
        text: the blame was put on an outsider on purpose
      two_culprits:
        text: there are two culprits, and neither knows of the other
      one_of_two:
        text: there are two to save, and time for only one
      dear_price:
        text: the only cure costs something no one can bear to lose
